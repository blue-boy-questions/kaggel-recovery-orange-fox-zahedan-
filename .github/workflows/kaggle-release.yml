name: Publish Kaggle Output to GitHub Release

on:
  workflow_dispatch:
    inputs:
      kaggle_username:
        description: 'نام کاربری کگل شما (اختیاری - اگر در ابتدای kernel_slug باشد خودکار برداشته می‌شود)'
        required: false
        default: ''
      kernel_slug:
        description: 'آدرس نوت‌بوک در کگل (فرمت: username/notebook-slug)'
        required: true
        default: 'username/orangefox-kaggle'
      release_tag:
        description: 'تگ رلیز در گیت‌هاب (مثلاً v1.0-ofox)'
        required: true
        default: 'v1.0-ofox'
      wait_for_completion:
        description: 'اگر نوت‌بوک هنوز در حال اجراست، صبر کند تا تمام شود؟'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release-kaggle-output:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Kaggle CLI
        run: pip install --upgrade kaggle

      - name: Configure Kaggle Credentials & Wait/Download Output
        env:
          KAGGLE_KEY_SECRET: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_USER_SECRET: ${{ secrets.KAGGLE_USERNAME }}
          INPUT_USER: ${{ github.event.inputs.kaggle_username }}
          KERNEL_SLUG: ${{ github.event.inputs.kernel_slug }}
          WAIT_COMPLETE: ${{ github.event.inputs.wait_for_completion }}
        run: |
          mkdir -p ~/.kaggle
          
          # بررسی اینکه آیا KAGGLE_KEY خودش یک JSON کامل است یا فقط رشته کلید
          if echo "$KAGGLE_KEY_SECRET" | grep -q '"username"'; then
            echo "$KAGGLE_KEY_SECRET" > ~/.kaggle/kaggle.json
          else
            K_USER="${INPUT_USER:-$KAGGLE_USER_SECRET}"
            if [ -z "$K_USER" ]; then
              K_USER=$(echo "$KERNEL_SLUG" | cut -d'/' -f1)
            fi
            printf '{"username":"%s","key":"%s"}\n' "$K_USER" "$KAGGLE_KEY_SECRET" > ~/.kaggle/kaggle.json
          fi
          
          chmod 600 ~/.kaggle/kaggle.json
          
          # بررسی وضعیت نوت‌بوک تا اتمام اجرا
          if [ "$WAIT_COMPLETE" = "true" ]; then
            echo "⏳ Checking kernel status for: $KERNEL_SLUG ..."
            for i in {1..180}; do
              STATUS=$(kaggle kernels status "$KERNEL_SLUG" 2>&1 || true)
              echo "[$i] $STATUS"
              if echo "$STATUS" | grep -qi "complete"; then
                echo "✅ Kernel execution completed!"
                break
              elif echo "$STATUS" | grep -qiE "error|cancel"; then
                echo "⚠️ Kernel finished with error/cancel status. Fetching available outputs/logs..."
                break
              fi
              sleep 60
            done
          fi
          
          echo "📥 Downloading outputs from Kaggle kernel: $KERNEL_SLUG ..."
          mkdir -p kaggle_output
          kaggle kernels output "$KERNEL_SLUG" -p kaggle_output
          
          echo "📂 Downloaded files Structure:"
          ls -lhR kaggle_output

      - name: Prepare Files for Release
        id: prep
        run: |
          mkdir -p release_assets
          # کپی فایل‌ها با این شرط که حجم آن‌ها بزرگ‌تر از صفر باشد (حذف فایل‌های خالی)
          find kaggle_output -type f -size +0c -exec cp -v {} release_assets/ \;
          
          # حذف فایل‌های متنی یا لاگ خالی اگر احیاناً باقی مانده باشند
          find release_assets -type f -empty -delete
          
          FILE_COUNT=$(ls -1 release_assets | wc -l)
          echo "Total valid files found: $FILE_COUNT"
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "❌ هیچ فایل معتبری با حجم بیشتر از صفر برای رلیز پیدا نشد!"
            exit 1
          fi
          ls -lh release_assets/

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: "OrangeFox Recovery (${{ github.event.inputs.release_tag }})"
          body: |
            ### 🦊 خروجی استخراج‌شده از کگل (`${{ github.event.inputs.kernel_slug }}`)
            * **تگ بیلد:** `${{ github.event.inputs.release_tag }}`
          files: release_assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
